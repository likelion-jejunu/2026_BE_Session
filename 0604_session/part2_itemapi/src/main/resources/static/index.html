<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { max-width: 720px; margin: 40px auto; padding: 0 16px; }
  </style>
</head>
<body>
  <h2 class="mb-4">📦 상품 관리</h2>

  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title mb-3">상품 등록</h5>
      <div class="row g-2">
        <div class="col"><input id="itemName" class="form-control" placeholder="상품명"></div>
        <div class="col"><input id="price" type="number" class="form-control" placeholder="가격"></div>
        <div class="col"><input id="quantity" type="number" class="form-control" placeholder="수량"></div>
        <div class="col-auto"><button class="btn btn-primary" onclick="createItem()">등록</button></div>
      </div>
    </div>
  </div>

  <table class="table table-hover align-middle">
    <thead>
      <tr><th>ID</th><th>상품명</th><th>가격</th><th>수량</th><th>관리</th></tr>
    </thead>
    <tbody id="itemTableBody"></tbody>
  </table>

  <script>
    const API = '/api/items';

    async function loadItems() {
      const res = await fetch(API);              // GET /api/items
      const items = await res.json();
      const tbody = document.getElementById('itemTableBody');
      tbody.innerHTML = '';
      items.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td>${item.id}</td>
            <td><input class="form-control" value="${item.itemName}" id="name-${item.id}"></td>
            <td><input class="form-control" type="number" value="${item.price}" id="price-${item.id}"></td>
            <td><input class="form-control" type="number" value="${item.quantity}" id="qty-${item.id}"></td>
            <td>
              <button class="btn btn-sm btn-success" onclick="updateItem(${item.id})">수정</button>
              <button class="btn btn-sm btn-danger" onclick="deleteItem(${item.id})">삭제</button>
            </td>
          </tr>`;
      });
    }

    async function createItem() {
      const body = {
        itemName: document.getElementById('itemName').value,
        price: Number(document.getElementById('price').value),
        quantity: Number(document.getElementById('quantity').value)
      };
      await fetch(API, {                          // POST /api/items
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      document.getElementById('itemName').value = '';
      document.getElementById('price').value = '';
      document.getElementById('quantity').value = '';
      loadItems();
    }

    async function updateItem(id) {
      const body = {
        itemName: document.getElementById(`name-${id}`).value,
        price: Number(document.getElementById(`price-${id}`).value),
        quantity: Number(document.getElementById(`qty-${id}`).value)
      };
      await fetch(`${API}/${id}`, {               // PUT /api/items/{id}
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      loadItems();
    }

    async function deleteItem(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });  // DELETE /api/items/{id}
      loadItems();
    }

    loadItems();
  </script>
</body>
</html>
